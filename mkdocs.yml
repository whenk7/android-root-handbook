site_name: Android Root 与 LSPosed 实战手册
site_description: 给半新手的玩机指南 — KernelSU / SukiSU / LSPosed / Zygisk / susfs / HMA / PIF
site_author: whenk7
site_url: https://whenk7.github.io/android-root-handbook/
repo_url: https://github.com/whenk7/android-root-handbook

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.view

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 第一阶段：基础概念:
    - 01-名词宇宙.md
    - 02-我是怎么跑起来的.md
    - 03-手机里的目录都是啥.md
    - 04-分区那些事儿.md
    - 05-挂载与覆盖.md
    - 06-权限与SELinux.md
    - 07-进程与注入.md
  - 第二阶段：方案:
    - 11-Root方案有哪些.md
    - 12-KernelSU是什么.md
    - 13-SukiSU和其他分支.md
    - 14-Hook框架演化史.md
    - 15-Zygisk和ZygiskNext.md
    - 16-LSPosed是什么.md
    - 17-LSPatch无Root方案.md
  - 第三阶段：隐藏 Root:
    - 21-为什么要隐藏Root.md
    - 22-三层防御体系.md
    - 23-susfs与内核层隐藏.md
    - 24-卸载模块-KSU与ZN排除列表.md
    - 25-prop隐藏.md
    - 26-HideMyApplist藏应用.md
    - 27-PlayIntegrity过检测.md
  - 第四阶段：用现成模块:
    - 31-KSU模块是什么.md
    - 32-LSP模块是什么.md
    - 33-KSU还是LSP决策树.md
    - 34-模块从哪找.md
  - 第五阶段：App Profile:
    - 41-AppProfile是什么.md
    - 42-用户身份控制.md
    - 43-权能Capabilities.md
    - 44-SELinux域定制.md
    - 45-防逃逸.md
    - 47-实战配置例子.md
  - 第六阶段：OTA 与备份:
    - 51-AB槽与无缝更新.md
    - 52-保Root升级.md
    - 53-该备份什么.md
    - 54-降级解锁升级链路.md
  - 第七阶段：写模块:
    - 61-KSU模块开发入门.md
    - 62-KSU启动脚本.md
    - 63-KSU改系统文件.md
    - 64-KSU元模块.md
    - 65-KSU模块WebUI.md
    - 66-LSP模块开发入门.md
    - 67-LSP核心API.md
    - 68-LSP进阶技巧.md
    - 69-写模块的踩坑指南.md
  - 第八阶段：救砖与排查:
    - 71-开不了机怎么办.md
    - 72-模块不工作排查.md
    - 73-App闪退排查.md
    - 74-SELinux拒绝怎么看.md
    - 75-OTA后Root丢失.md
  - 第九阶段：安全与信任:
    - 81-第三方Fork的风险.md
    - 82-adb安全.md
    - 83-模块可信度判断.md
  - 收尾:
    - 90-FAQ.md
  - 速查表:
    - cheatsheets/常用路径.md
    - cheatsheets/常用命令.md
    - cheatsheets/救砖速查.md
    - cheatsheets/名词速查.md
    - cheatsheets/决策树.md
  - 示例代码:
    - examples/README.md

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

# examples 目录里的文件不进导航，但可以通过链接访问
not_in_nav: |
  /examples/
